name: Daily Stock AI Prediction Update

# 매일 한국 시간 밤 10시 (UTC 13:00) 자동 실행 + 수동 실행 지원
on:
  schedule:
    - cron: '0 13 * * 1-5' # 월~금 장 마감 후 실행
  workflow_dispatch:        # 깃허브 웹에서 수동 실행 버튼 클릭 가능

permissions:
  contents: write           # 깃허브 저장소 자동 커밋 & 푸시 권한

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🤖 Run AI Prediction & Data Collection Engine
        run: |
          python backend/runner.py

      - name: 🚀 Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "🤖 [Auto] AI 주가 예측 데이터 자동 갱신 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push
          fi
